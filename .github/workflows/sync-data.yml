name: Synchronisation des données

on:
  schedule:
    - cron: "0 4 * * 1"        # lundi 4h UTC — OSM + Lyon
  workflow_dispatch:
    inputs:
      depts:
        description: "Départements INSEE (ex. 69,38)"
        default: "69,75,13,31,06,44,34,67,33,59"

permissions:
  contents: write
  actions: write   # pour déclencher le déploiement Pages après le commit du bot

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Synchroniser
        # 10 plus grandes villes : Lyon, Paris, Marseille, Toulouse, Nice,
        # Nantes, Montpellier, Strasbourg, Bordeaux, Lille (départements entiers)
        run: node pipeline/sync.js --depts "${{ github.event.inputs.depts || '69,75,13,31,06,44,34,67,33,59' }}"
      - name: Committer si changement
        id: commit
        run: |
          git config user.name "mappee-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet web/data/toilets.geojson; then
            git add web/data/toilets.geojson
            git commit -m "data: synchronisation $(date -u +%F)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun changement de données."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Déclencher le déploiement Pages
        # les pushes du bot ne déclenchent pas les autres workflows (règle
        # anti-boucle de GitHub) — on commande donc le déploiement explicitement
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
